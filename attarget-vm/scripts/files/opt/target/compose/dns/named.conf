// ISC Lab 08 attack target — bind9 (task F4: zone transfer)
//
// Recursion is off (no cache-poisoning surface) but zone transfers are open,
// which is the mistake: the whole zone, including the flag TXT record, is
// handed to anyone who asks for an AXFR.

options {
	directory "/var/cache/bind";
	listen-on { any; };
	listen-on-v6 { none; };
	recursion no;
	allow-transfer { any; };
	dnssec-validation no;
};

zone "isc.lab" {
	type master;
	file "/etc/bind/db.isc.lab";
};
