# ISC Lab 08 attack target — knock-gated maintenance console (task F5)
#
# Runs as the image's `nginx` user (uid 101): port 9999 is unprivileged, so no
# capabilities are needed at all, and the root fs stays read-only (pid and temp
# paths live under /tmp, which is a tmpfs).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 64;
}

http {
	include /etc/nginx/mime.types;
	default_type text/html;
	access_log /dev/stdout;

	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;

	server {
		listen 9999;
		root /usr/share/nginx/html;
		index index.html;
	}
}
