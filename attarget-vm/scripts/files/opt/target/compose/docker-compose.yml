# Lab 08 attack target — service stack
#
# Every service uses `network_mode: host` on purpose: a student's nmap sees the
# real host ports, iptables rules apply to INPUT, and any container can reach
# another one's 127.0.0.1 (the pivoting task). Images are built at VM build time
# (`docker compose build` in 55-target-services.sh); nothing is pulled at runtime.
#
# All containers run as root but with all capabilities dropped except
# NET_BIND_SERVICE (needed to bind the low ports), and only mount the flags
# directory read-only — a container escape gets you nothing on the host.

name: isc-attack-target

services:
  # port 80/tcp — "device manager" dashboard, leaked version banner (F1, F2)
  web:
    build: ./web
    image: isc/attarget-web
    network_mode: host
    restart: always
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./web/www:/www:ro

  # port 161/udp — sensor gateway, public read-only community (F3)
  snmp:
    build: ./snmp
    image: isc/attarget-snmp
    network_mode: host
    restart: always
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  # port 53/tcp+udp — sensor inventory zone, open AXFR (F4)
  dns:
    build: ./dns
    image: isc/attarget-dns
    network_mode: host
    restart: always
    # named binds 53 as root, then drops to the `bind` user (SETUID/SETGID)
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]

  # port 9999/tcp — maintenance console, only reachable after the knock (F5)
  knockweb:
    build: ./knockweb
    image: isc/attarget-knockweb
    network_mode: host
    restart: always
    user: "101:101"          # unprivileged port, so no capabilities at all
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  # port 23/tcp — old console with factory credentials operator:operator (F6)
  telnet:
    build: ./telnet
    image: isc/attarget-telnet
    network_mode: host
    restart: always
    volumes:
      - type: bind
        source: ./telnet/flag
        target: /home/operator/.flag
        read_only: true
    # telnetd binds :23 as root; login then chowns the pty and switches to the
    # operator user (same privilege-drop pattern as bind9)
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
  # port 79/tcp — finger: user enumeration + operator's .plan (F7)
  finger:
    build: ./finger
    image: isc/attarget-finger
    network_mode: host
    restart: always
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
  # port 8080/tcp — Apache 2.4.49, CVE-2021-41773 path traversal (F9)
  cve-apache:
    build: ./cve-apache
    image: isc/attarget-cve-apache
    network_mode: host
    restart: always
    # the master runs as root and spawns the workers as `daemon` (8080 itself
    # is unprivileged, so NET_BIND_SERVICE is not needed)
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
