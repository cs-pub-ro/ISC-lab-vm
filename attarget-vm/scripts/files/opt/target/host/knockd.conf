[options]
	logfile = /var/log/knockd.log

[openWeb]
	sequence    = 11731,24472,39913
	seq_timeout = 10
	tcpflags    = syn
	start_command = /usr/sbin/iptables -I INPUT 1 -s %IP% -p tcp --dport 9999 -j ACCEPT
	cmd_timeout = 60
	stop_command  = /usr/sbin/iptables -D INPUT -s %IP% -p tcp --dport 9999 -j ACCEPT
